# pr-agent - GitHub PR AI 코드 리뷰 게이트 (ZCode 자율 파이프라인 Phase 1)
#
# 사전 조건: devops-tools 네임스페이스에 pr-agent-secrets 시크릿(.secrets.toml).
# 원본은 OpenBao (secret/devops/pr-agent-llm, secret/devops/pr-agent-github).
# 전체 구성: docs/ai-autonomous-pipeline.md

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pr-agent
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: pr-agent
spec:
  project: default

  source:
    repoURL: https://github.com/kimjoongwon/prj-devops.git
    path: helm/development-tools/pr-agent
    targetRevision: main
    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: devops-tools  # buzz-gateway와 같은 네임스페이스

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  revisionHistoryLimit: 3

  info:
    - name: Purpose
      value: "GitHub PR webhook -> /review + /improve AI code review (GLM via z.ai)"
    - name: Runbook
      value: "docs/ai-autonomous-pipeline.md"
