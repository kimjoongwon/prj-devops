# ArgoCD GitHub Webhook Ingress - Production
# Cloudflare Access 우회용: www.onjitda.com/api/webhook -> argocd-server (namespace argocd)
# 상세 사유/구조는 helm/ingress/values-argocd-webhook.yaml 주석 참고

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-webhook-ingress-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: argocd-webhook-ingress
    app.kubernetes.io/instance: production
    environment: production
spec:
  project: default

  source:
    repoURL: https://github.com/kimjoongwon/prj-devops.git
    path: helm/ingress
    targetRevision: main
    helm:
      valueFiles:
        - values-argocd-webhook.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - ApplyOutOfSyncOnly=true

    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  info:
    - name: "Purpose"
      value: "GitHub webhook entry bypassing Cloudflare Access (www.onjitda.com/api/webhook)"
