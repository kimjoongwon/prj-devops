# Grafana - Production 환경 ArgoCD Application

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: production
    environment: production
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/kimjoongwon/prj-devops.git
    path: helm/development-tools/grafana
    targetRevision: main
    helm:
      releaseName: grafana
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: grafana
  # ServerSideApply에서는 ESO가 기본값으로 채우는 ExternalSecret 필드를 ArgoCD가
  # 제거할 수 없어 영구 OutOfSync가 남는다(2026-10-04 grafana-smtp 사례) — 무시 처리
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - '.spec.target.creationPolicy'
        - '.spec.target.deletionPolicy'
        - '.spec.data[].remoteRef.conversionStrategy'
        - '.spec.data[].remoteRef.decodingStrategy'
        - '.spec.data[].remoteRef.metadataPolicy'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      # 대시보드 ConfigMap이 256KiB last-applied 어노테이션 한계를 초과 → SSA로 우회
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 5
  info:
    - name: "Environment"
      value: "Production"
    - name: "Description"
      value: "Grafana with provisioned Tempo/Prometheus datasources and APM dashboards"
