# Admin Web - Staging 환경 ArgoCD Application

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: admin-web-stg
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: admin-web
    app.kubernetes.io/instance: staging
    environment: staging
spec:
  project: default

  # Git 소스 설정 (multi-source: 차트·환경설정은 prj-devops, 배포 상태(이미지 태그)는 prj-deploy)
  sources:
    - repoURL: https://github.com/kimjoongwon/prj-devops.git
      path: helm/applications/admin-web
      targetRevision: main
      helm:
        valueFiles:
          - values-stg.yaml
          # 태그는 prj-deploy의 배포 상태 파일이 덮어씀 (뒤에 오는 valueFiles가 이김)
          - "$values/stg/admin-web.yaml"
    - repoURL: https://github.com/kimjoongwon/prj-deploy.git
      targetRevision: main
      ref: values

  # 배포 대상 클러스터 및 네임스페이스
  destination:
    server: https://kubernetes.default.svc
    namespace: plate-stg

  # 동기화 정책
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - '.spec.template.metadata.annotations["kubectl.kubernetes.io/restartedAt"]'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true

    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  revisionHistoryLimit: 10

  info:
    - name: "Environment"
      value: "Staging"
    - name: "Domain"
      value: "stg.onjitda.com (경로 / 및 /admin)"
    - name: "Description"
      value: "Admin Web - Staging Environment (Next.js)"
