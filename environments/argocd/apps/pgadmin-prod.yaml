# pgAdmin - Production 환경 ArgoCD Application

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pgadmin-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: pgadmin
    app.kubernetes.io/instance: production
    environment: production
spec:
  project: default

  source:
    repoURL: https://github.com/kimjoongwon/prj-devops.git
    path: helm/applications/pgadmin
    targetRevision: main
    helm:
      valueFiles:
        - values-prod.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: plate-prod

  # kubectl rollout restart 흔적(restartedAt)을 drift로 보지 않음 — 3-way merge가 제거 불가해
  # 이 annotation이 남으면 앱이 영구 OutOfSync가 됨 (2026-09-23 정비)
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - '.spec.template.metadata.annotations["kubectl.kubernetes.io/restartedAt"]'

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true

    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  revisionHistoryLimit: 10

  info:
    - name: "Environment"
      value: "Production"
    - name: "Domain"
      value: "db.onjitda.com"
    - name: "Description"
      value: "pgAdmin Dashboard - Production Environment"
