# IDP Web - Production 환경 ArgoCD Application

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: idp-web-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: idp-web
    app.kubernetes.io/instance: production
    environment: production
spec:
  project: default

  # multi-source: 차트·환경설정은 prj-devops, 배포 상태(이미지 태그)는 prj-deploy
  sources:
    - repoURL: https://github.com/kimjoongwon/prj-devops.git
      path: helm/applications/idp-web
      targetRevision: main
      helm:
        valueFiles:
          - values-prod.yaml
          # 태그는 prj-deploy의 배포 상태 파일이 덮어씀 (뒤에 오는 valueFiles가 이김)
          - "$values/prod/idp-web.yaml"
    - repoURL: https://github.com/kimjoongwon/prj-deploy.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: plate-prod

  # kubectl rollout restart 흔적(restartedAt)을 drift로 보지 않음 — 3-way merge가 제거 불가해
  # 이 annotation이 남으면 앱이 영구 OutOfSync가 됨 (2026-09-23 정비)
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - '.spec.template.metadata.annotations["kubectl.kubernetes.io/restartedAt"]'

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true

    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  revisionHistoryLimit: 10

  info:
    - name: "Environment"
      value: "Production"
    - name: "Domain"
      value: "idp.onjitda.com"
    - name: "Description"
      value: "IDP Web - Production Environment"
