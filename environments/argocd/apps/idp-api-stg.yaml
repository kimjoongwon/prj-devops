# IDP API - Staging 환경 ArgoCD Application

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: idp-api-stg
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: idp-api
    app.kubernetes.io/instance: staging
    environment: staging
spec:
  project: default

  # multi-source: 차트·환경설정은 prj-devops, 배포 상태(이미지 태그)는 prj-deploy
  sources:
    - repoURL: https://github.com/kimjoongwon/prj-devops.git
      path: helm/applications/idp-api
      targetRevision: main
      helm:
        valueFiles:
          - values-stg.yaml
          # 태그는 prj-deploy의 배포 상태 파일이 덮어씀 (뒤에 오는 valueFiles가 이김)
          - "$values/stg/idp-api.yaml"
    - repoURL: https://github.com/kimjoongwon/prj-deploy.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: plate-stg

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true

    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  revisionHistoryLimit: 10

  info:
    - name: "Environment"
      value: "Staging"
    - name: "Domain"
      value: "idp-stg.onjitda.com (api/oidc)"
    - name: "Description"
      value: "IDP API - Staging Environment"
