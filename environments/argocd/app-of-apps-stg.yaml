# Application of Applications 패턴
# 스테이징 Child Application만 관리하는 ArgoCD Parent Application
# plate-cache, openbao-cluster-secrets-manager 같은 공유 Child는
# production Parent와의 중복 소유를 피하기 위해 포함하지 않습니다.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-web-apps-stg
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: frontend-web-apps-stg
    app.kubernetes.io/part-of: frontend-web
    environment: staging
spec:
  project: default
  source:
    repoURL: https://github.com/kimjoongwon/prj-devops.git
    path: environments/argocd/apps
    targetRevision: main
    directory:
      recurse: true
      include: "*-stg.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  info:
    - name: "Description"
      value: "Frontend Web Applications - Staging App of Apps pattern"
    - name: "Environment"
      value: "Staging only"
    - name: "Components"
      value: "admin-web, core-api, spring-api, idp-web, idp-api, ingress, openbao-secrets-manager"
    - name: "Namespaces"
      value: "plate-stg"
