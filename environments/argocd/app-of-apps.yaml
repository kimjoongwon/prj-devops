# Application of Applications 패턴
# 모든 환경의 애플리케이션들을 관리하는 메인 ArgoCD Application

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-web-apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: frontend-web-apps
    app.kubernetes.io/part-of: frontend-web
spec:
  project: default
  source:
    repoURL: https://github.com/kimjoongwon/prj-devops.git  # 실제 Git Repository URL로 변경 필요
    path: environments/argocd/apps
    targetRevision: main
    directory:
      recurse: true
      include: "*.yaml"
      # Deployment mode toggle:
      # - prod only: exclude "*-stg.yaml"
      # - stg only:  exclude "*-prod.yaml"
      # - all:       remove exclude line
      exclude: "*-stg.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  info:
    - name: 'Description'
      value: 'Frontend Web Applications - App of Apps pattern'
    - name: 'Environment'
      value: 'Production only (staging excluded by directory.exclude)'
    - name: 'Components'
      value: 'fe-web, be-server, ingress, container-cache, apm(grafana/tempo/otel)'
    - name: 'Namespaces'
      value: 'plate-prod'
