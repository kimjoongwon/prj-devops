# Application of Applications 패턴
# 모든 환경의 애플리케이션들을 관리하는 메인 ArgoCD Application

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-web-apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: frontend-web-apps
    app.kubernetes.io/part-of: frontend-web
spec:
  project: default
  source:
    repoURL: https://github.com/kimjoongwon/prj-devops.git
    path: environments/argocd/apps
    targetRevision: main
    directory:
      recurse: true
      include: "*.yaml"
      # Deployment mode toggle:
      # - prod only: exclude "*-stg.yaml"
      # - stg only:  exclude "*-prod.yaml"
      # - all:       remove exclude line
      # 2026-10-04: stg 재활성화 — 서비스 4앱(core-api/admin-web/idp-api/idp-web) +
      # plate-db/ingress/secrets-manager가 stg로 함께 운영됨
      # (proposal-web/tool-storybook/plate-llm은 운영 전용 — stg 매니페스트 없음)
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  info:
    - name: 'Description'
      value: 'Frontend Web Applications - App of Apps pattern'
    - name: 'Environment'
      value: 'prod + stg (2026-10-04 stg reactivated — services only)'
    - name: 'Components'
      value: 'apps: proposal-web, admin-web, core-api, idp-web, idp-api, tool-storybook, plate-db, pgadmin(+ingress), ingress · infra: cloudflared, buildkitd, buzz-gateway, postgres/redis exporter · apm: grafana/tempo/otel/loki/alloy · secrets: openbao(-cluster)-secrets-manager'
    - name: 'Namespaces'
      value: 'plate-prod 외 다중(devops-tools, grafana, redis, cloudflared, external-secrets)'
