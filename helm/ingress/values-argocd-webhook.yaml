# ArgoCD GitHub Webhook 전용 Ingress (values)
# 목적: Cloudflare Access가 argocd.onjitda.com 전 경로를 보호하여 GitHub 웹훅(리다이렉트 미수행)이
# 도달하지 못하는 문제를 우회. Access 보호가 없는 공개 호스트 www.onjitda.com의 /api/webhook 경로만
# ArgoCD server로 라우팅한다. GitHub Payload URL: https://www.onjitda.com/api/webhook
#
# TLS: 방문자 구간은 Cloudflare 엣지 인증서(*.onjitda.com)로 종단되고 터널→nginx 구간은 검증하지
# 않으므로 별도 인증서 발급 불요 (cert-manager 어노테이션 의도적으로 제거).
# 노출 범위: /api/webhook Exact 1개 경로뿐 — ArgoCD UI/UI API는 여전히 Access 뒤에 있음.

appName: argocd-webhook

services: {}

ingress:
  enabled: true
  name: argocd-webhook-ingress
  className: nginx
  annotations:
    ingress.kubernetes.io/ssl-redirect: "false"
    # 차트 기본값의 인증서 발급 어노테이션 제거 (CF 엣지 인증서 사용, 발급 불요)
    cert-manager.io/cluster-issuer: null
    acme.cert-manager.io/http01-edit-in-place: null
  hosts:
    - host: www.onjitda.com
      paths:
        - path: /api/webhook
          pathType: Exact
          backend:
            service:
              name: argocd-server
              port:
                number: 80
  tls: []
