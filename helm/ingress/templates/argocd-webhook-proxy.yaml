{{- if .Values.argocdWebhookProxy }}
# Cloudflare Access 뒤 도메인의 GitHub 웹훅 우회용 초소형 프록시
# - /            → argocd-server (기존 /api/webhook Exact 경로의 백엔드)
# - /api/jenkins-webhook/ → Jenkins GWT (push-router 잡, 2026-10-04 추가)
#
# cocdev-ingress(plate-prod)에서 argocd namespace의 argocd-server로 직접 백엔드를 지정할
# 수 없고(컨트롤러가 Ingress와 같은 namespace만 참조), ArgoCD resource.exclusions 때문에
# 정적 Endpoints 객체도 GitOps로 관리할 수 없어, 같은 namespace에 프록시 파드를 둔다.
# 경로 라우팅은 values.yaml의 onjitda.com /api/webhook(Exact)과
# /api/jenkins-webhook(Prefix)이 이 Service로 향한다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-webhook-proxy-conf
  labels:
    app.kubernetes.io/name: argocd-webhook
    app.kubernetes.io/component: proxy
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  default.conf: |
{{ include "argocdWebhookProxy.nginxConf" . | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-webhook-proxy
  labels:
    app.kubernetes.io/name: argocd-webhook
    app.kubernetes.io/component: proxy
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-webhook
      app.kubernetes.io/component: proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argocd-webhook
        app.kubernetes.io/component: proxy
      # nginx은 설정 파일 변경을 자동 리로드하지 않는다 — nginx conf의 체크섬으로
      # ConfigMap 변경 시 파드를 롤시켜 반영한다(2026-10-04 수동 재시작으로 밝혀진 함정).
      annotations:
        checksum/nginx-conf: {{ include "argocdWebhookProxy.nginxConf" . | sha256sum }}
    spec:
      containers:
        - name: nginx
          image: {{ .Values.argocdWebhookProxy.image }}
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
          readinessProbe:
            tcpSocket:
              port: http
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 16Mi
      volumes:
        - name: conf
          configMap:
            name: argocd-webhook-proxy-conf
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.argocdWebhookProxy.serviceName }}
  labels:
    app.kubernetes.io/name: argocd-webhook
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: argocd-webhook
    app.kubernetes.io/component: proxy
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}
