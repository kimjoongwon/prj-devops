{{- if .Values.argocdWebhookEndpoint }}
# ArgoCD GitHub 웹훅 우회용 엔드포인트 (Cloudflare Access가 argocd.onjitda.com을 보호해
# GitHub 웹훅이 도달하지 못하는 문제 대응)
#
# 이 Ingress(plate-prod)에서 argocd namespace의 argocd-server로 바로 백엔드를 지정할 수
# 없어서(컨트롤러가 Ingress와 같은 namespace의 Endpoints만 참조), selector 없는 Service와
# Endpoints 쌍으로 argocd-server ClusterIP를 가리킨다. 경로 라우팅은 values.yaml의
# onjitda.com /api/webhook(Exact)이 이 Service로 향한다.
#
# 주의: targetIP는 argocd namespace argocd-server Service의 ClusterIP로, 해당 Service가
# 삭제 후 재생성되면(ClusterIP 변경) 이 값도 갱신해야 한다.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.argocdWebhookEndpoint.name }}
  labels:
    app.kubernetes.io/name: argocd-webhook
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.argocdWebhookEndpoint.port }}
      targetPort: {{ .Values.argocdWebhookEndpoint.port }}
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: {{ .Values.argocdWebhookEndpoint.name }}
  labels:
    app.kubernetes.io/name: argocd-webhook
    app.kubernetes.io/managed-by: {{ .Release.Service }}
subsets:
  - addresses:
      - ip: {{ .Values.argocdWebhookEndpoint.targetIP | quote }}
    ports:
      - name: http
        port: {{ .Values.argocdWebhookEndpoint.port }}
        protocol: TCP
{{- end }}
