# 공용 Ingress Chart Staging 값
# 목적: plate-stg 네임스페이스 서비스(frontend/backend)를 외부(stg 서브도메인)로 노출
# 차이점: HTTP 허용(ssl-redirect=false), TLS는 실서명(또는 스테이징) 인증서, 도메인 stg.onjitda.com / idp-stg.onjitda.com

# App name (default: plate)
appName: plate

# Service names (actual service names in the cluster)
services:                 # ArgoCD 릴리스명 기준 Service 오브젝트 이름 매핑
  frontend:
    name: "admin-web-stg"
    port: 80
  backend:
    name: "core-api-stg"
    port: 3006
  admin:
    name: "admin-web-stg"
    port: 80

ingress:
  enabled: true
  name: "cocdev-ingress"
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"   # 필요 시 스테이징 ClusterIssuer 로 교체
    ingress.kubernetes.io/ssl-redirect: "false"          # Staging 은 HTTP 허용 (테스트 편의)
    acme.cert-manager.io/http01-edit-in-place: "true"
  hosts:
    - host: stg.onjitda.com
      paths:
        # /proposal prefix -> proposal landing
        - path: /proposal
          pathType: Prefix
          backend:
            service:
              name: proposal-web-stg
              port:
                number: 80
        # 전체 루트 -> 기본 진입 서비스
        - path: /
          pathType: Prefix
          backend:
            service:
              name: frontend
              port:
                number: 80
        # IDP 인증/관리 경로는 IDP API로 전달
        - path: /api/v1/auth
          pathType: Prefix
          backend:
            service:
              name: idp-api-stg
              port:
                number: 80
        - path: /api/v1/idp
          pathType: Prefix
          backend:
            service:
              name: idp-api-stg
              port:
                number: 80
        - path: /api/v1/oidc-clients
          pathType: Prefix
          backend:
            service:
              name: idp-api-stg
              port:
                number: 80
        - path: /api/v1/oidc-sessions
          pathType: Prefix
          backend:
            service:
              name: idp-api-stg
              port:
                number: 80
        # /api prefix -> 백엔드 API
        - path: /api
          pathType: Prefix
          backend:
            service:
              name: backend
              port:
                number: 80
        # /admin prefix -> 관리자 페이지
        - path: /admin
          pathType: Prefix
          backend:
            service:
              name: admin
              port:
                number: 80
    - host: llm.onjitda.com
      paths:
        # LLM 서비스 전체 경로
        - path: /
          pathType: Prefix
          backend:
            service:
              name: plate-llm-stg
              port:
                number: 80
    - host: idp-stg.onjitda.com
      paths:
        - path: /api
          pathType: Exact
          backend:
            service:
              name: idp-api-stg
              port:
                number: 80
        - path: /api/
          pathType: Prefix
          backend:
            service:
              name: idp-api-stg
              port:
                number: 80
        - path: /oidc
          pathType: Exact
          backend:
            service:
              name: idp-api-stg
              port:
                number: 80
        - path: /oidc/
          pathType: Prefix
          backend:
            service:
              name: idp-api-stg
              port:
                number: 80
        - path: /
          pathType: Prefix
          backend:
            service:
              name: idp-web-stg
              port:
                number: 80
  
  tls:
    - secretName: plate-stg-tls   # SAN 인증서: 모든 스테이징 도메인 포함
      hosts:
        - stg.onjitda.com
        - llm.onjitda.com
        - idp-stg.onjitda.com
