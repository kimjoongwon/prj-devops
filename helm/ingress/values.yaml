# 공용 Ingress Chart 기본 값 (Production)
# 목적: plate-stg / plate-prod 네임스페이스의 대표 서비스(frontend, backend)를 단일 Ingress 리소스로 노출
# 환경별 차이: host / TLS secret / ssl-redirect 정책 (staging 은 values-stg.yaml 참고)

# App name (default: plate)
appName: plate

# Service names (actual service names in the cluster)
services: # 실제 Kubernetes Service 이름과 포트 매핑 (ArgoCD Release 명 기준)
  frontend:
    name: "admin-web-prod" # 기본 진입 서비스
    port: 80
  backend:
    name: "core-api-prod"
    port: 3006
  admin:
    name: "admin-web-prod"
    port: 80

ingress:
  enabled: true
  name: "cocdev-ingress" # 생성될 Ingress 객체명
  className: "nginx" # IngressClass (컨트롤러 식별)
  annotations: # 보안/성능/SSL 관련 어노테이션
    cert-manager.io/cluster-issuer: "letsencrypt-prod" # 프로덕션 실서명 인증서
    nginx.ingress.kubernetes.io/ssl-redirect: "true" # HTTP -> HTTPS 리다이렉트 (TLS 인그레스의 nginx 기본동작과 동일하게 명시)
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120" # 업스트림 응답 대기 (기본 60s → 장기 요청/SSE 보호)
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120" # 업스트림 전송 대기
    nginx.ingress.kubernetes.io/proxy-body-size: "10m" # 요청 본문 상한 (기본 1m → 업로드 413 방지)
    acme.cert-manager.io/http01-edit-in-place: "true"
  hosts:
    - host: onjitda.com # 메인 도메인 (A 레코드 -> Ingress Controller LB)
      paths:
        # /story prefix -> Storybook 정적 서비스
        - path: /story
          pathType: Prefix
          backend:
            service:
              name: tool-storybook-prod
              port:
                number: 80
        # /storybook legacy prefix -> Storybook 정적 서비스
        - path: /storybook
          pathType: Prefix
          backend:
            service:
              name: tool-storybook-prod
              port:
                number: 80
        # /proposal prefix -> proposal landing
        - path: /proposal
          pathType: Prefix
          backend:
            service:
              name: proposal-web-prod
              port:
                number: 80
        # 기본 진입 경로
        - path: /
          pathType: Prefix
          backend:
            service:
              name: frontend
              port:
                number: 80
        # IDP 인증/관리 경로는 IDP API로 전달
        - path: /api/v1/auth
          pathType: Prefix
          backend:
            service:
              name: idp-api-prod
              port:
                number: 80
        - path: /api/v1/idp
          pathType: Prefix
          backend:
            service:
              name: idp-api-prod
              port:
                number: 80
        - path: /api/v1/oidc-clients
          pathType: Prefix
          backend:
            service:
              name: idp-api-prod
              port:
                number: 80
        - path: /api/v1/oidc-sessions
          pathType: Prefix
          backend:
            service:
              name: idp-api-prod
              port:
                number: 80
        # ArgoCD GitHub 웹훅 — Cloudflare Access가 argocd.onjitda.com을 보호해 우회 경로로
        # 노출 (Exact 매칭이 하단 /api Prefix보다 우선). 백엔드는 values-argocd-endpoint.yaml의
        # Service/Endpoints(argocd-server ClusterIP)를 경유.
        - path: /api/webhook
          pathType: Exact
          backend:
            service:
              name: argocd-webhook
              port:
                number: 80
        # Jenkins GitHub 웹훅(push-router GWT) — jenkins.onjitda.com도 Cloudflare Access 뒤라
        # 같은 우회 체인으로 노출. Prefix 매칭이 /api(아래)보다 길어 우선하고,
        # argocd-webhook nginx의 /api/jenkins-webhook/ location이 Jenkins로 전달한다.
        # 웹훅 URL: /api/jenkins-webhook/generic-webhook-trigger/invoke?token=<push-router 토큰>
        - path: /api/jenkins-webhook
          pathType: Prefix
          backend:
            service:
              name: argocd-webhook
              port:
                number: 80
        # PR-Agent GitHub 웹훅(AI 리뷰 게이트, 2026-10-05) — 같은 우회 체인.
        # argocd-webhook nginx의 /api/pr-agent/ location이 pr-agent Service로 전달한다.
        # 웹훅 URL: /api/pr-agent/api/v1/github_webhooks
        - path: /api/pr-agent
          pathType: Prefix
          backend:
            service:
              name: argocd-webhook
              port:
                number: 80
        # API 경로 (백엔드 서비스로 프록시)
        - path: /api
          pathType: Prefix
          backend:
            service:
              name: backend
              port:
                number: 80
        # /admin prefix -> 관리자 페이지
        - path: /admin
          pathType: Prefix
          backend:
            service:
              name: admin
              port:
                number: 80
    - host: idp.onjitda.com # IDP 전용 도메인
      paths:
        - path: /api
          pathType: Exact
          backend:
            service:
              name: idp-api-prod
              port:
                number: 80
        - path: /api/
          pathType: Prefix
          backend:
            service:
              name: idp-api-prod
              port:
                number: 80
        - path: /oidc
          pathType: Exact
          backend:
            service:
              name: idp-api-prod
              port:
                number: 80
        - path: /oidc/
          pathType: Prefix
          backend:
            service:
              name: idp-api-prod
              port:
                number: 80
        - path: /
          pathType: Prefix
          backend:
            service:
              name: idp-web-prod
              port:
                number: 80
  tls:
    - secretName: web-prod-tls # cert-manager 가 관리하는 프로덕션 TLS 시크릿
      hosts:
        - onjitda.com # SAN / CN 매칭 호스트 목록
        - idp.onjitda.com
