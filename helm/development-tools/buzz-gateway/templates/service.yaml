apiVersion: v1
kind: Service
metadata:
  name: buzz-gateway
  labels:
    app.kubernetes.io/name: buzz-gateway
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: buzz-gateway
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
