image:
  repository: grafana/alloy
  tag: "v1.19.2"
  pullPolicy: IfNotPresent

loki:
  # 로그 적재 엔드포인트
  url: http://loki.grafana.svc.cluster.local:3100/loki/api/v1/push

service:
  httpPort: 12345

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 512Mi

prometheus:
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "12345"

# 모든 노드(control-plane 포함)에서 로그를 수집해야 하므로 기본 허용
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

nodeSelector: {}
affinity: {}
