apiVersion: apps/v1
kind: Deployment
metadata:
  name: pr-agent
  labels:
    app.kubernetes.io/name: pr-agent
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: pr-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pr-agent
      # configuration.toml 변경 시 파드 롤 (subPath 마운트는 자동 갱신 안 됨).
      # pr-agent-secrets(수동 시크릿) 교체 시에는 rollout restart 필요 — 문서 참조.
      annotations:
        checksum/config: {{ .Files.Get "configuration.toml" | sha256sum }}
    spec:
      containers:
        - name: pr-agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: GUNICORN_WORKERS
              value: {{ .Values.env.GUNICORN_WORKERS | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          volumeMounts:
            # 이미지의 기본 설정 위에 우리 설정/시크릿만 덮어쓴다 (subPath)
            - name: config
              mountPath: /app/pr_agent/settings/configuration.toml
              subPath: configuration.toml
              readOnly: true
            - name: secrets
              mountPath: /app/pr_agent/settings/.secrets.toml
              subPath: .secrets.toml
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: pr-agent-config
        - name: secrets
          secret:
            secretName: pr-agent-secrets
