replicaCount: 1

image:
  repository: grafana/tempo
  tag: "2.6.1"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  queryPort: 3200
  otlpGrpcPort: 4317
  otlpHttpPort: 4318

persistence:
  enabled: true
  storageClass: openebs-hostpath
  accessModes:
    - ReadWriteOnce
  size: 20Gi

retention: 168h

prometheus:
  # tempo /metrics 는 query HTTP 포트(3200)에서 노출 — Grafana up{} 컴포넌트 다운 알림 커버리지용
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "3200"

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 2Gi

nodeSelector: {}
tolerations: []
affinity: {}
