replicaCount: 1

image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.103.1"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  otlpGrpcPort: 4317
  otlpHttpPort: 4318
  healthPort: 13133
  metricsPort: 8889
  selfMetricsPort: 8888

exporters:
  tempo:
    endpoint: tempo.grafana.svc.cluster.local:4317

spanmetrics:
  enabled: true
  resourceToTelemetryConversion: false
  metricsFlushInterval: 15s
  dimensions:
    - http.method
    - http.route
    - http.target
  histogramBuckets:
    - 5ms
    - 10ms
    - 25ms
    - 50ms
    - 100ms
    - 250ms
    - 500ms
    - 1s
    - 2s
    - 5s
    - 10s

prometheus:
  # Service 어노테이션(Prometheus kubernetes-services 잡)은 collector 자체 메트릭(otelcol_*) 수집.
  # Grafana의 OpenTelemetry Collector 대시보드(15983)가 이 메트릭을 요구한다.
  serviceAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "8888"
  # 파드 어노테이션(kubernetes-pods 잡)은 기존처럼 spanmetrics(8889)를 수집한다.
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "8889"

redaction:
  enabled: true
  keys:
    - http.request.header.authorization
    - http.request.header.cookie
    - http.response.header.set-cookie

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}
