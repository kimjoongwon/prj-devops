apiVersion: v1
kind: Service
metadata:
  name: {{ include "buildkitd.fullname" . }}
  labels:
    {{- include "buildkitd.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: grpc
      port: {{ .Values.service.port }}
      targetPort: grpc
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "buildkitd.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
