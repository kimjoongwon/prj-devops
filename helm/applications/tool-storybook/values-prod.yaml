# Production environment values for Tool Storybook

replicaCount: 1

tool-storybook:
  image:
    repository: harbor.onjitda.com/prod/tool-storybook
    # 이미지 태그는 prj-deploy prod/tool-storybook.yaml 에서 관리 (ArgoCD multi-source)
    pullPolicy: IfNotPresent
  port: 3009
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

appSecrets:
  enabled: false
  secretName: tool-storybook-env-secrets
