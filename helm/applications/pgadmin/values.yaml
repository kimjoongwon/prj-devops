# pgAdmin 웹 대시보드 기본 값

replicaCount: 1

pgadmin:
  image:
    repository: dpage/pgadmin4
    tag: "9.13"
    pullPolicy: IfNotPresent
  port: 5050
  resources:
    limits:
      cpu: 300m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

service:
  type: ClusterIP
  port: 80
  targetPort: 5050

auth:
  email: admin@cocdev.co.kr
  # 운영 PostgreSQL 인증 Secret 이름
  existingSecret: plate-db-secrets
  passwordKey: POSTGRES_PASSWORD

server:
  name: Plate Production DB
  group: CocDev
  # 운영 PostgreSQL Service 이름
  host: plate-db-prod
  port: 5432
  maintenanceDb: plate_prod
  username: plate_prod
  sslMode: require
  connectTimeout: 10
  importOnStartup: true

persistence:
  enabled: true
  storageClass: openebs-hostpath
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  mountPath: /var/lib/pgadmin

podSecurityContext:
  fsGroup: 5050

containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 5050
  runAsGroup: 5050

probes:
  startup:
    enabled: true
    failureThreshold: 30
    periodSeconds: 10
    timeoutSeconds: 5
  liveness:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
  readiness:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
