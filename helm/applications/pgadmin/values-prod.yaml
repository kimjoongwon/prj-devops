# Production 환경 설정

replicaCount: 1

pgadmin:
  resources:
    limits:
      cpu: 300m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

auth:
  email: admin@plate.com
  existingSecret: pgadmin-auth-secrets
  passwordKey: PGADMIN_PASSWORD

persistence:
  enabled: false

server:
  importOnStartup: false
