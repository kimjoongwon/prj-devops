apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "plate-db-admin.name" . }}
  labels:
    {{- include "plate-db-admin.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "plate-db-admin.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "plate-db-admin.labels" . | nindent 8 }}
      annotations: {}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ include "plate-db-admin.name" . }}
          image: "{{ index .Values "plate-db-admin" "image" "repository" }}:{{ index .Values "plate-db-admin" "image" "tag" | default .Chart.AppVersion }}"
          imagePullPolicy: {{ index .Values "plate-db-admin" "image" "pullPolicy" }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ index .Values "plate-db-admin" "port" }}
              protocol: TCP
          env:
            - name: PGADMIN_DEFAULT_EMAIL
              value: {{ .Values.auth.email | quote }}
            - name: PGADMIN_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.passwordKey }}
            - name: PGADMIN_DISABLE_POSTFIX
              value: "true"
            - name: PGADMIN_REPLACE_SERVERS_ON_STARTUP
              value: "True"
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
          {{- end }}
          resources:
            {{- toYaml (index .Values "plate-db-admin" "resources") | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            - name: servers
              mountPath: /pgadmin4/servers.json
              subPath: servers.json
              readOnly: true
      volumes:
        - name: servers
          configMap:
            name: {{ include "plate-db-admin.name" . }}-servers
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "plate-db-admin.name" . }}-data
