apiVersion: v1
kind: Service
metadata:
  name: {{ include "cover-letter-web.name" . }}
  labels:
    {{- include "cover-letter-web.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
  selector:
    {{- include "cover-letter-web.selectorLabels" . | nindent 4 }}
