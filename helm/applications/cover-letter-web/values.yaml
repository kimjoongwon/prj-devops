# 운영(prod) 전용 정적 앱. 런타임 시크릿·서버 저장소가 필요하지 않다.
replicaCount: 1

cover-letter-web:
  image:
    repository: harbor.onjitda.com/prod/cover-letter-web
    # Jenkins가 만든 prj-deploy prod/cover-letter-web.yaml의 SHA-12 태그가 필수다.
    tag: ""
    pullPolicy: IfNotPresent
  port: 8080
  resources:
    requests:
      cpu: 25m
      memory: 16Mi
    limits:
      cpu: 200m
      memory: 64Mi

imagePullSecrets:
  - name: harbor-docker-secret

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 2
  timeoutSeconds: 1
  failureThreshold: 30

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 5
  timeoutSeconds: 1
  failureThreshold: 3

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 10
  timeoutSeconds: 1
  failureThreshold: 3
