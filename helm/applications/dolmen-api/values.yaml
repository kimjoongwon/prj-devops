# Dolmen API Chart 기본 값 파일
# hello-agents 기반 에이전트 메모리·RAG 학습 데모 (prj-core apps/dolmen/api)
# 환경별 오버라이드: values-prod.yaml, values-stg.yaml

replicaCount: 1

# dolmen-api 애플리케이션 설정
dolmen-api:
  image:
    repository: harbor.onjitda.com/stg/dolmen-api
    tag: "latest"
    pullPolicy: IfNotPresent
  port: 3012
  resources:
    # 로컬 임베딩 추론(fastembed ONNX CPU)을 감안해 여유 있게
    limits:
      cpu: "1"
      memory: 1536Mi
    requests:
      cpu: 250m
      memory: 512Mi
  probes:
    startup:
      # 첫 요청 전 모델 로딩/시딩이 있을 수 있어 tcp 소켓 판정으로 넉넉히
      tcpSocket:
        port: http
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 18
    readiness:
      tcpSocket:
        port: http
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    liveness:
      tcpSocket:
        port: http
      periodSeconds: 20
      timeoutSeconds: 3
      failureThreshold: 3

# Harbor registry authentication
imagePullSecrets:
  - name: harbor-docker-secret

service:
  type: ClusterIP
  port: 3012
  targetPort: 3012

# 애플리케이션 환경변수 Secret 설정
# stg는 기존 core-api/staging → 환경 공유 app-env-secrets 연결을 유지한다.
# prod는 appSecrets를 비활성화하고 아래 전용 llm Secret만 개별 참조한다.
appSecrets:
  enabled: true
  secretName: app-env-secrets

# 인프라 공통 시크릿은 이 앱이 사용하지 않는다
infraSecrets:
  enabled: false

# 전용 LLM 접속 설정. 활성화 시 세 문자열만 별도 Secret에 동기화한다.
# 실제 접속 값은 OpenBao에만 두며 values에는 경로·이름만 지정한다.
llm:
  enabled: false
  secretName: dolmen-llm
  externalSecret:
    refreshInterval: 30m
    secretStoreRef:
      name: ""
      kind: SecretStore
    remoteKey: ""

# 비공개 이력서는 OpenBao 전용 KV에서 동기화한다. 원본·base64·개인정보를 values에 넣지 않는다.
# 활성화 환경은 같은 namespace에 존재하는 SecretStore와 원격 KV 경로를 지정해야 한다.
resume:
  enabled: false
  secretName: dolmen-resume
  mountPath: /etc/dolmen
  externalSecret:
    refreshInterval: 30m
    secretStoreRef:
      name: ""
      kind: SecretStore
    remoteKey: ""
  # PDF 추출·색인까지 성공해야 트래픽을 받는다. 비활성화 시 기존 TCP readiness를 사용한다.
  readinessProbe:
    httpGet:
      path: /api/documents
      port: http
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 30
    failureThreshold: 6

# 애플리케이션 추가 환경변수
extraEnv:
  - name: DOLMEN_DEBUG_ENABLED
    value: "false"
