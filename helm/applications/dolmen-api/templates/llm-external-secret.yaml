{{- if .Values.llm.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "dolmen-api.name" . }}-llm
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dolmen-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: llm-external-secret
spec:
  refreshInterval: {{ .Values.llm.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ required "llm 활성화 시 기존 SecretStore 이름을 지정해야 합니다" .Values.llm.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.llm.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ .Values.llm.secretName }}
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    {{- range $key := list "LLM_API_KEY" "LLM_BASE_URL" "LLM_MODEL_ID" }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ required "llm 활성화 시 OpenBao KV 경로를 지정해야 합니다" $.Values.llm.externalSecret.remoteKey }}
        property: {{ $key }}
        decodingStrategy: None
    {{- end }}
{{- end }}
