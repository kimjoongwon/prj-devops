{{- if .Values.resume.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "dolmen-api.name" . }}-resume
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dolmen-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: resume-external-secret
spec:
  refreshInterval: {{ .Values.resume.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ required "resume 활성화 시 기존 SecretStore 이름을 지정해야 합니다" .Values.resume.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.resume.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ .Values.resume.secretName }}
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: resume.pdf
      remoteRef:
        key: {{ required "resume 활성화 시 OpenBao KV 경로를 지정해야 합니다" .Values.resume.externalSecret.remoteKey }}
        property: resume_pdf
        decodingStrategy: Base64
    - secretKey: candidate_name
      remoteRef:
        key: {{ .Values.resume.externalSecret.remoteKey }}
        property: candidate_name
        decodingStrategy: None
    - secretKey: resume_updated_at
      remoteRef:
        key: {{ .Values.resume.externalSecret.remoteKey }}
        property: resume_updated_at
        decodingStrategy: None
{{- end }}
