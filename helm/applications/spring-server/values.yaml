# Spring Server Chart 기본 값 파일
# Kubernetes에 배포할 Spring Boot 백엔드 서버 설정
# 환경별 오버라이드: values-prod.yaml, values-stg.yaml

replicaCount: 1

# spring-server 애플리케이션 설정
spring-server:
  image:
    repository: harbor.cocdev.co.kr/stg/spring-server
    tag: "latest"
    pullPolicy: IfNotPresent
  port: 8080
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

# Harbor registry authentication
imagePullSecrets:
  - name: harbor-docker-secret

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# 애플리케이션 환경변수 Secret 설정
# OpenBao KV 경로: server/staging, server/production
# 시크릿: app-env-secrets (환경별 공유)
appSecrets:
  enabled: true
  secretName: app-env-secrets

# 애플리케이션 추가 환경변수
extraEnv: []

# Spring Java Agent (OpenTelemetry) 옵션
javaAgent:
  enabled: false
  mountPath: /otel/auto-instrumentation
  jarPath: /otel/auto-instrumentation/opentelemetry-javaagent.jar
  downloadUrl: https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/download/v2.16.0/opentelemetry-javaagent.jar
  initContainer:
    image: curlimages/curl:8.8.0
    pullPolicy: IfNotPresent
