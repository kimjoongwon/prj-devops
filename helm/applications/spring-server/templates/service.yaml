# Spring Server Backend Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "spring-server.name" . }}
  labels:
    {{- include "spring-server.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}           # External service port
      targetPort: {{ .Values.service.targetPort }} # Container port (spring-server.port: 8080)
      protocol: TCP
      name: http
  selector:
    {{- include "spring-server.selectorLabels" . | nindent 4 }}
