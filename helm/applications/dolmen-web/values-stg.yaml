# Staging environment values for Dolmen Web
# Override from values.yaml for staging environment

replicaCount: 1

# Staging 이미지 저장소 (Harbor registry)
# 이미지 규칙: harbor.onjitda.com/{환경}/{앱이름}
dolmen-web:
  image:
    repository: harbor.onjitda.com/stg/dolmen-web
    tag: "latest"
    pullPolicy: Always  # Staging은 항상 최신 이미지 가져옴
  port: 3013
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

appSecrets:
  enabled: false
  secretName: ""

extraEnv:
  # Next rewrites가 /dolmen/api/* 를 dolmen-api로 프록시하는 대상 (같은 ns 서비스)
  - name: DOLMEN_API_URL
    value: "http://dolmen-api-stg.plate-stg.svc.cluster.local:3012"
