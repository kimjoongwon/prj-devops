# Proposal Web Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dolmen-web.name" . }}
  labels:
    {{- include "dolmen-web.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "dolmen-web.selectorLabels" . | nindent 4 }}
