# Production environment values for IDP Web

replicaCount: 1
idp-web:
  image:
    repository: harbor.onjitda.com/prod/idp-web
    tag: "1cd72dbaaae0"
    pullPolicy: IfNotPresent
  port: 3008
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
appSecrets:
  enabled: true
  secretName: idp-web-env-secrets
extraEnv:
  - name: OTEL_SERVICE_NAME
    value: idp-web-prod
  - name: NODE_OPTIONS
    value: "--require /otel-ai/autoinstrumentation.js"
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://otel-collector.grafana.svc.cluster.local:4317"
  - name: OTEL_EXPORTER_OTLP_PROTOCOL
    value: "grpc"
  - name: OTEL_TRACES_SAMPLER
    value: "parentbased_traceidratio"
  - name: OTEL_TRACES_SAMPLER_ARG
    value: "1.0"
# OTel nodejs 자동계측 주입 (init container로 SDK 탑재, NODE_OPTIONS로 로드)
otel:
  enabled: true
  image: otel/autoinstrumentation-nodejs
  imageTag: "0.78.0"
