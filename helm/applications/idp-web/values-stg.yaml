# Staging environment values for IDP Web

replicaCount: 1

idp-web:
  image:
    repository: harbor.cocdev.co.kr/stg/idp-web
    tag: "latest"
    pullPolicy: Always
  port: 3008
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

appSecrets:
  enabled: true
  secretName: idp-web-env-secrets

extraEnv:
  - name: OTEL_SERVICE_NAME
    value: idp-web-stg
