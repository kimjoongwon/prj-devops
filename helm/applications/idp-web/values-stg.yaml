# Staging environment values for IDP Web

replicaCount: 1

idp-web:
  image:
    repository: harbor.onjitda.com/stg/idp-web
    tag: "latest"
    pullPolicy: Always
  port: 3008
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

appSecrets:
  enabled: true
  secretName: idp-web-env-secrets

extraEnv:
  # 로그인/동의 페이지(/auth/login|consent/[uid])의 SSR interaction 조회 대상.
  - name: IDP_API_INTERNAL_URL
    value: http://idp-api-stg
  - name: OTEL_SERVICE_NAME
    value: idp-web-stg
