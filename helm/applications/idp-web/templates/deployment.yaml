apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "idp-web.name" . }}
  labels:
    {{- include "idp-web.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "idp-web.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "idp-web.labels" . | nindent 8 }}
      annotations: {}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and .Values.otel .Values.otel.enabled }}
      # OTel nodejs 자동계측 — 모듈을 emptyDir로 복사 (NODE_OPTIONS로 로드)
      initContainers:
        - name: otel-autoinstrumentation
          image: "otel/autoinstrumentation-nodejs:{{ .Values.otel.imageTag }}"
          command: ["sh", "-c", "cp -r /autoinstrumentation/. /otel-ai/"]
          volumeMounts:
            {{- if and .Values.otel .Values.otel.enabled }}
            - name: otel-ai
              mountPath: /otel-ai
            {{- end }}
      {{- end }}
      containers:
        - name: {{ include "idp-web.name" . }}
          image: "{{ index .Values "idp-web" "image" "repository" }}:{{ index .Values "idp-web" "image" "tag" | default .Chart.AppVersion }}"
          imagePullPolicy: {{ index .Values "idp-web" "image" "pullPolicy" }}
          ports:
            - name: http
              containerPort: {{ index .Values "idp-web" "port" }}
              protocol: TCP
          {{- with .Values.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.appSecrets.enabled }}
          envFrom:
            - secretRef:
                name: {{ .Values.appSecrets.secretName }}
          {{- end }}
          {{- if and .Values.otel .Values.otel.enabled }}
          volumeMounts:
            - name: otel-ai
              mountPath: /otel-ai
          {{- end }}
          resources:
            {{- toYaml (index .Values "idp-web" "resources") | nindent 12 }}

      {{- if and .Values.otel .Values.otel.enabled }}
      volumes:
        - name: otel-ai
          emptyDir: {}
      {{- end }}
