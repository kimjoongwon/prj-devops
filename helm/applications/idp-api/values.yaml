# IDP API Chart 기본 값 파일
# Kubernetes에 배포할 IDP API 애플리케이션 설정

replicaCount: 1

idp-api:
  image:
    repository: harbor.cocdev.co.kr/stg/idp-api
    tag: "latest"
    pullPolicy: IfNotPresent
  port: 3007
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 512Mi

imagePullSecrets:
  - name: harbor-docker-secret

service:
  type: ClusterIP
  port: 80
  targetPort: 3007

appSecrets:
  enabled: true
  secretName: idp-api-env-secrets

# 인프라 공통 환경변수 Secret 설정
# OpenBao 경로: devops/{environment}
infraSecrets:
  enabled: true
  secretName: infra-env-secrets

command: []
args: []

extraEnv: []

# 앱 배포 전에 스키마/기준 데이터를 먼저 반영하는 PreSync Job 설정
migrationJob:
  enabled: true
  backoffLimit: 2
  ttlSecondsAfterFinished: 300
  workingDir: /app/packages/be-prisma
  command:
    - /bin/sh
    - -lc
  args:
    - |
      set -e
      cd /app/packages/be-prisma
      node_modules/.bin/prisma migrate deploy
      node_modules/.bin/tsx data-migrate.ts
  resources:
    limits:
      cpu: 300m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
