# Production environment values for IDP API

replicaCount: 1

idp-api:
  image:
    repository: harbor.onjitda.com/prod/idp-api
    tag: "12"
    pullPolicy: IfNotPresent
  port: 3007
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 512Mi

appSecrets:
  enabled: true
  secretName: idp-api-env-secrets

command:
  - sh
  - -c
  - |
    set -e
    sed -i "s|globalThis\\['__dirname'\\].*|globalThis['__dirname'] = __dirname;|" /app/packages/be-prisma/dist/src/generated/client/client.js
    # 앱이 /app/runtime의 자체 node_modules를 쓰므로 그 사본도 동일 패치 (없어도 기동은 계속)
    sed -i "s|globalThis\\['__dirname'\\].*|globalThis['__dirname'] = __dirname;|" /app/runtime/node_modules/@cocrepo/prisma/dist/src/generated/client/client.js 2>/dev/null || true
    # 러너가 마이그레이션 워크스페이스와 앱을 분리(/app/runtime)하면서 진입점 경로 변경
    cd /app/runtime
    exec node dist/main.js
args: []

extraEnv:
  - name: APP_NAME
    value: idp
  - name: APP_PORT
    value: "3007"
  - name: OIDC_ISSUER
    value: https://idp.onjitda.com
  - name: OIDC_INTERACTION_BASE_URL
    value: https://idp.onjitda.com
  - name: OIDC_ADMIN_BASE_URL
    value: https://onjitda.com
  - name: OTEL_SERVICE_NAME
    value: idp-api-prod
