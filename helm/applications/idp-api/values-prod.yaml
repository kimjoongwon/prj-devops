# Production environment values for IDP API

replicaCount: 1

idp-api:
  image:
    repository: harbor.onjitda.com/prod/idp-api
    tag: "12"
    pullPolicy: IfNotPresent
  port: 3007
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 512Mi

appSecrets:
  enabled: true
  secretName: idp-api-env-secrets

command:
  - sh
  - -c
  - |
    set -e
    sed -i "s|globalThis\\['__dirname'\\].*|globalThis['__dirname'] = __dirname;|" /app/packages/be-prisma/dist/src/generated/client/client.js
    # 러너는 마이그레이션·앱 모두 워크스페이스 구조(/app/apps)로 실행한다
    exec node apps/idp/api/dist/main.js
args: []

extraEnv:
  - name: APP_NAME
    value: idp
  - name: APP_PORT
    value: "3007"
  - name: OIDC_ISSUER
    value: https://idp.onjitda.com
  - name: OIDC_INTERACTION_BASE_URL
    value: https://idp.onjitda.com
  - name: OIDC_ADMIN_BASE_URL
    value: https://onjitda.com
  - name: OTEL_SERVICE_NAME
    value: idp-api-prod
