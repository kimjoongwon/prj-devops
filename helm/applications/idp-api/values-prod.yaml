# Production environment values for IDP API

replicaCount: 1

idp-api:
  image:
    repository: harbor.onjitda.com/prod/idp-api
    tag: "14"
    pullPolicy: IfNotPresent
  port: 3007
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 512Mi

appSecrets:
  enabled: true
  secretName: idp-api-env-secrets

command:
  - sh
  - -c
  - |
    set -e
    sed -i "s|globalThis\\['__dirname'\\].*|globalThis['__dirname'] = __dirname;|" /app/packages/be-prisma/dist/src/generated/client/client.js
    # 러너는 마이그레이션·앱 모두 워크스페이스 구조(/app/apps)로 실행한다
    exec node apps/idp/api/dist/main.js
args: []

extraEnv:
  - name: APP_NAME
    value: idp
  - name: APP_PORT
    value: "3007"
  - name: OIDC_ISSUER
    value: https://idp.onjitda.com
  - name: OIDC_INTERACTION_BASE_URL
    value: https://idp.onjitda.com
  - name: OIDC_ADMIN_BASE_URL
    value: https://onjitda.com
  - name: OTEL_SERVICE_NAME
    value: idp-api-prod
  - name: NODE_OPTIONS
    value: "--require /otel-ai/autoinstrumentation.js"
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://otel-collector.grafana.svc.cluster.local:4317"
  - name: OTEL_EXPORTER_OTLP_PROTOCOL
    value: "grpc"
  - name: OTEL_TRACES_SAMPLER
    value: "parentbased_traceidratio"
  - name: OTEL_TRACES_SAMPLER_ARG
    value: "1.0"
  # 브라우저 호출 허용 출처 (runtime-security: https 절대 URL 콤마 목록, 와일드카드 금지)
  - name: CORS_ALLOWED_ORIGINS
    value: https://www.onjitda.com,https://onjitda.com,https://idp.onjitda.com

# OTel nodejs 자동계측 주입 (init container로 SDK 탑재, NODE_OPTIONS로 로드)
otel:
  enabled: true
  image: harbor.onjitda.com/prod/autoinstrumentation-nodejs
  imageTag: "0.78.0"
