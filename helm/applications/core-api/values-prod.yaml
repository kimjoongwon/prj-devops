# Production environment values for Core API
# Override from values.yaml for production environment

replicaCount: 1

# Production 이미지 저장소 (Harbor registry)
# 이미지 규칙: harbor.onjitda.com/{환경}/{앱이름}
core-api:
  image:
    repository: harbor.onjitda.com/prod/core-api
    tag: "4"
    pullPolicy: Always
  port: 3006
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

# Production 환경 시크릿
appSecrets:
  enabled: true
  secretName: app-env-secrets

# 서비스별 APM 식별자와 신규 runtime-security 계약 환경변수
extraEnv:
  - name: OTEL_SERVICE_NAME
    value: core-api-prod
  # app-env-secrets(OpenBao 동기화)에 없는 필수값 보충 — 포트/URL은 민감하지 않음
  - name: REDIS_PORT
    value: "6379"
  - name: OIDC_INTERACTION_BASE_URL
    value: https://idp.onjitda.com
  # idp 서명 공개키·쿠키 시크릿은 idp 시크릿에서 해당 키만 참조 (전체 secret 노출 없음)
  - name: OIDC_JWKS_KEYS
    valueFrom:
      secretKeyRef:
        name: idp-api-env-secrets
        key: OIDC_JWKS_KEYS
  - name: OIDC_COOKIE_SECRET
    valueFrom:
      secretKeyRef:
        name: idp-api-env-secrets
        key: OIDC_COOKIE_SECRET
  # 브라우저 호출 허용 출처 (runtime-security: https 절대 URL 콤마 목록, 와일드카드 금지)
  - name: CORS_ALLOWED_ORIGINS
    value: https://www.onjitda.com,https://onjitda.com,https://idp.onjitda.com
