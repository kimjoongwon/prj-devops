# PostgreSQL 기본 설정
postgresql:
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent

  port: 5432

  # 데이터베이스 초기 설정
  database: plate
  username: plate

  # 리소스 제한
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

# 영속성 스토리지 설정
persistence:
  enabled: true
  storageClass: "openebs-hostpath"
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  mountPath: /var/lib/postgresql/data

# Service 설정
service:
  type: ClusterIP
  port: 5432
  annotations: {}
  loadBalancerIP: ""
  loadBalancerSourceRanges: []
  externalTrafficPolicy: ""

# 시크릿 설정
secrets:
  # 기존 Secret 사용 (kubectl create secret으로 미리 생성)
  existingSecret: "plate-db-secrets"
  passwordKey: "POSTGRES_PASSWORD"

# PostgreSQL TLS 설정
tls:
  enabled: false
  secretName: ""
  autoGenerate: false
  host: ""

# Startup/Liveness/Readiness Probe
probes:
  # initdb/WAL replay 등 장기 복구 동안 liveness가 복구 중인 DB를 kill하지
  # 않도록 시작 예산을 별도로 확보한다 (30회 × 10s = 300s).
  # startupProbe가 성공할 때까지 liveness/readiness는 비활성된다.
  startup:
    enabled: true
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
  liveness:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
  readiness:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
