# PostgreSQL Headless Service (StatefulSet DNS 해석용)
apiVersion: v1
kind: Service
metadata:
  name: {{ include "plate-db.headlessServiceName" . }}
  labels:
    {{- include "plate-db.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: {{ .Values.service.port }}
      targetPort: postgresql
      protocol: TCP
      name: postgresql
  selector:
    {{- include "plate-db.selectorLabels" . | nindent 4 }}
