{{- if and .Values.tls.enabled .Values.tls.autoGenerate }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "plate-db.tlsCertificateName" . }}
  labels:
    {{- include "plate-db.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.tls.secretName }}
  # cert-manager v1.16+는 commonName 미지정 시 subject DN을 비운 인증서를 발급하고,
  # Java(JDBC/DataGrip)는 issuer DN이 빈 인증서를 TLS 핸드셰이크에서 파싱하지 못한다(08006 bad_certificate).
  commonName: {{ include "plate-db.name" . }}
  issuerRef:
    name: {{ include "plate-db.tlsIssuerName" . }}
    kind: Issuer
  privateKey:
    algorithm: RSA
    size: 2048
  dnsNames:
    - {{ include "plate-db.name" . | quote }}
    - {{ printf "%s.%s" (include "plate-db.name" .) .Release.Namespace | quote }}
    - {{ printf "%s.%s.svc" (include "plate-db.name" .) .Release.Namespace | quote }}
    - {{ printf "%s.%s.svc.cluster.local" (include "plate-db.name" .) .Release.Namespace | quote }}
    {{- if .Values.tls.host }}
    - {{ .Values.tls.host | quote }}
    {{- end }}
{{- end }}
