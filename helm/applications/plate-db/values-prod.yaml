# Production 환경 설정

postgresql:
  database: plate_prod
  username: plate_prod

  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi

persistence:
  size: 20Gi

service:
  type: LoadBalancer
  loadBalancerSourceRanges: []

tls:
  enabled: true
  autoGenerate: true
  secretName: plate-db-server-tls
  host: db.cocdev.co.kr
