# Production 환경 설정

postgresql:
  database: plate_prod
  username: plate_prod
  # 주의: resources는 postgresql: 안에 있어야 템플릿(postgresql.resources)에 반영됨.
  # 최상위에 있으면 무시되고 base values(512Mi/1Gi)로 렌더링됨
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    # idle 실사용 ~60Mi(피크 여유 포함 512Mi). limit 2Gi는 유지해 버스트 흡수
    requests:
      cpu: 500m
      memory: 512Mi

persistence:
  size: 20Gi

service:
  type: LoadBalancer
  # 외부 접속 허용 대역(CIDR). 빈 리스트 = 전체 허용(현재 운영과 동일, 거동 무변화).
  # 예: 사무실/VPN 대역 확인 후 ["203.0.113.0/24"] 형태로 지정하면 해당 대역만 5432 접근 가능.
  # 잘못된 CIDR 지정 시 접속이 차단되므로 실제 접속 경로 확인 후 적용할 것.
  loadBalancerSourceRanges: []

tls:
  enabled: true
  autoGenerate: true
  secretName: plate-db-server-tls
  host: db.onjitda.com
