# Production 환경 설정

postgresql:
  database: plate_prod
  username: plate_prod
  # 주의: resources는 postgresql: 안에 있어야 템플릿(postgresql.resources)에 반영됨.
  # 최상위에 있으면 무시되고 base values(512Mi/1Gi)로 렌더링됨
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    # idle 실사용 ~60Mi(피크 여유 포함 512Mi). limit 2Gi는 유지해 버스트 흡수
    requests:
      cpu: 500m
      memory: 512Mi

persistence:
  size: 20Gi

service:
  type: LoadBalancer
  # 외부 접속 허용 대역(CIDR) — 사무실 LAN(192.168.0.0/24)만 허용 (2026-10-05 적용,
  # DataGrip 직접 접속(노트북 192.168.0.111) 경로 확인. VPN 대역 추가 시 여기에 append).
  loadBalancerSourceRanges:
    - 192.168.0.0/24

tls:
  enabled: true
  autoGenerate: true
  secretName: plate-db-server-tls
  host: db.onjitda.com
