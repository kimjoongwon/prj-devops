{{- if .Values.pnpmStore.enabled }}
# 외부 PR CI(Jenkinsfile.public-ci)의 pnpm 스토어 공유 캐시 PVC
# 매 PR 콜드 install을 제거하는 것이 목적이다.
# container-builder-pvc(RWO)가 podman 전용이라 임의 노드에 붙을 수 없는 것과 달리,
# 임의 노드에 스케줄되는 CI pod가 pnpm 스토어를 함께 쓰려면 RWX(NFS)가 필요하다.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.pnpmStore.name }}
  labels:
    app.kubernetes.io/name: pnpm-store
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- with .Values.pnpmStore.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- with .Values.pnpmStore.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  accessModes: {{ toYaml .Values.pnpmStore.accessModes | nindent 2 }}
  resources:
    requests:
      storage: {{ .Values.pnpmStore.size }}
  storageClassName: {{ .Values.pnpmStore.storageClass }}
{{- end }}
