# container-cache chart values
# 환경별 override 로 PVC 용량/StorageClass 조정

pvc:
  enabled: true
  name: container-builder-pvc
  storageClass: "openebs-hostpath"
  accessModes:
    - ReadWriteOnce
  size: 50Gi
  annotations: {}
  labels: {}
  mountPath: /var/lib/docker  # (참고) 실제 사용 애플리케이션 차트에서 volumeClaimTemplates 또는 PVC mount 로 연결

# 외부 PR CI(Jenkinsfile.public-ci)의 pnpm 스토어 공유 캐시
# 매 PR 콜드 install을 제거하기 위해 pnpm store 디렉터리를 PVC로 공유한다.
# container-builder-pvc(RWO)와 달리 임의 노드에 스케줄되는 CI pod를 위해
# ReadWriteMany(NFS StorageClass)가 필요하다.
pnpmStore:
  enabled: true
  name: pnpm-store-pvc
  storageClass: "nfs-client"
  accessModes:
    - ReadWriteMany
  size: 20Gi
  annotations: {}
  labels: {}
