# Proposal Web Chart 기본 값 파일
# Kubernetes에 배포할 Next.js 퍼블릭 랜딩 애플리케이션 설정
# 환경별 오버라이드: values-prod.yaml, values-stg.yaml

replicaCount: 1

# proposal-web 애플리케이션 설정
proposal-web:
  image:
    repository: harbor.cocdev.co.kr/stg/proposal-web
    tag: "latest"
    pullPolicy: IfNotPresent
  # Next.js 기본 포트
  port: 3011
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

# Harbor registry authentication
imagePullSecrets:
  - name: harbor-docker-secret

service:
  type: ClusterIP
  port: 80
  targetPort: 3011

# 이 앱은 정적 랜딩이라 런타임 시크릿 의존성이 없습니다.
appSecrets:
  enabled: false
  secretName: ""

# 애플리케이션 추가 환경변수
extraEnv: []
