# Staging environment values for Admin Web
# Override from values.yaml for staging environment

replicaCount: 1

# Staging 이미지 저장소 (Harbor registry)
# 이미지 규칙: harbor.onjitda.com/{환경}/{앱이름}
admin-web:
  image:
    repository: harbor.onjitda.com/stg/admin-web
    # 이미지 태그는 prj-deploy stg/admin-web.yaml 에서 관리 (ArgoCD multi-source)
    pullPolicy: Always
  port: 3000
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

# Staging 환경 시크릿
appSecrets:
  enabled: true
  secretName: app-env-secrets

extraEnv:
  - name: CORE_API_INTERNAL_URL
    value: http://core-api-stg:3006
  - name: IDP_API_INTERNAL_URL
    value: http://idp-api-stg
  - name: OTEL_SERVICE_NAME
    value: admin-web-stg
