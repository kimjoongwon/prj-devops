# Production environment values for Admin Web
# Override from values.yaml for production environment

replicaCount: 1

# Production 이미지 저장소 (Harbor registry)
# 이미지 규칙: harbor.onjitda.com/{환경}/{앱이름}
admin-web:
  image:
    repository: harbor.onjitda.com/prod/admin-web
    tag: "10"
    pullPolicy: IfNotPresent  # Production은 캐시된 이미지 사용
  port: 3000
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi

# Production 환경 시크릿
appSecrets:
  enabled: true
  secretName: app-env-secrets

extraEnv:
  - name: CORE_API_INTERNAL_URL
    value: http://core-api-prod:3006
  - name: IDP_API_INTERNAL_URL
    value: http://idp-api-prod
  - name: OTEL_SERVICE_NAME
    value: admin-web-prod
  - name: NODE_OPTIONS
    value: "--require /otel-ai/autoinstrumentation.js"
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://otel-collector.grafana.svc.cluster.local:4317"
  - name: OTEL_EXPORTER_OTLP_PROTOCOL
    value: "grpc"
  - name: OTEL_TRACES_SAMPLER
    value: "parentbased_traceidratio"
  - name: OTEL_TRACES_SAMPLER_ARG
    value: "1.0"

# OTel nodejs 자동계측 주입 (init container로 SDK 탑재, NODE_OPTIONS로 로드)
otel:
  enabled: true
  image: harbor.onjitda.com/prod/autoinstrumentation-nodejs
  imageTag: "0.78.0"
