# 인프라 컴포넌트 시크릿 - 클러스터 인프라 토큰을 OpenBao KV에서 동기화
# (2026-10-04 시크릿 통합 Phase 2: harbor-admin / cloudflare dns01·tunnel 토큰)
# 기존 수동 k8s 시크릿은 ESO(creationPolicy: Owner)가 인계 — 값은 동일해야 한다.
# 봉인 시 블라스트 레디우스: 기존 시크릿이 etcd에 남아 파드 재시작에 무영향.
# 시크릿이 삭제된 상태에서 봉인되면 복구가 막히므로 삭제는 신중히 (복구 런북 참조).
{{- if .Values.infraSecrets.enabled }}
{{- range .Values.infraSecrets.items }}
{{- $kvKey := .key }}
---
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: {{ .name }}
  labels:
    {{- include "openbao-cluster-secrets-manager.labels" $ | nindent 4 }}
    app.kubernetes.io/component: infra-external-secret
spec:
  # 이 ESO 버전의 CRD는 matchNames 미지원 — 기존 cluster-external-secret과 동일한
  # matchExpressions(kubernetes.io/metadata.name) 형식을 쓴다
  namespaceSelector:
    matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: In
        values:
          - {{ .namespace }}
  refreshTime: {{ .refreshInterval | default "1h" }}
  externalSecretSpec:
    refreshInterval: {{ .refreshInterval | default "1h" }}
    secretStoreRef:
      name: {{ $.Values.clusterSecretStore.name }}
      kind: ClusterSecretStore
    target:
      name: {{ .targetSecretName }}
      creationPolicy: Owner
      # ESO가 기본값으로 채우는 필드 — Git에 명시해야 영구 OutOfSync가 남지 않음
      deletionPolicy: Retain
    data:
      {{- range .keys }}
      - secretKey: {{ .secretKey }}
        remoteRef:
          # 아래 3개도 ESO 기본값 — 명시 (이유는 target.deletionPolicy와 동일)
          conversionStrategy: Default
          decodingStrategy: None
          metadataPolicy: None
          key: {{ $kvKey }}
          property: {{ .remoteProperty | default .secretKey }}
      {{- end }}
{{- end }}
{{- end }}
