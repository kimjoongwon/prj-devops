{{- if .Values.plateDb.enabled }}
{{- range .Values.global.namespaces }}
{{- $namespace := . }}
{{- $env := "development" }}
{{- if contains "prod" . }}
{{- $env = "production" }}
{{- else if contains "stg" . }}
{{- $env = "staging" }}
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $.Values.plateDb.externalSecret.name | default "plate-db-secrets-sync" }}
  namespace: {{ $namespace }}
  labels:
    {{- include "openbao-secrets-manager.labels" $ | nindent 4 }}
    app.kubernetes.io/component: plate-db-external-secret
    environment: {{ $env }}
spec:
  refreshInterval: {{ $.Values.plateDb.externalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ include "openbao-secrets-manager.secretStoreName" $ }}
    kind: SecretStore
  target:
    # plate-db 차트가 existingSecret 으로 읽는 plate-db-secrets 를 직접 소유
    # (2026-10-04: 수동 k8s 시크릿 → OpenBao KV secret/plate-db/<env> 기반 GitOps 관리로 전환)
    name: {{ $.Values.plateDb.externalSecret.target.name | default "plate-db-secrets" }}
    creationPolicy: {{ $.Values.plateDb.externalSecret.target.creationPolicy | default "Owner" }}
    template:
      type: {{ $.Values.plateDb.externalSecret.target.template.type | default "Opaque" }}
      metadata:
        labels:
          {{- include "openbao-secrets-manager.labels" $ | nindent 10 }}
          {{- with $.Values.plateDb.externalSecret.target.template.metadata.labels }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          environment: {{ $env }}
  data:
    # plate-db 차트는 POSTGRES_PASSWORD 키만 읽는다 — KV의 username/database 는 기록용 메타
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        {{- if eq $env "production" }}
        key: {{ $.Values.plateDb.production.remoteRef.key | default "plate-db/production" }}
        {{- else if eq $env "staging" }}
        key: {{ $.Values.plateDb.staging.remoteRef.key | default "plate-db/staging" }}
        {{- else }}
        key: {{ $.Values.plateDb.development.remoteRef.key | default "plate-db/development" }}
        {{- end }}
        property: POSTGRES_PASSWORD
{{- end }}
{{- end }}
