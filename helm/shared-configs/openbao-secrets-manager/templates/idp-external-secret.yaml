{{- if .Values.idp.enabled }}
{{- range .Values.global.namespaces }}
{{- $namespace := . }}
{{- $env := "development" }}
{{- if contains "prod" . }}
{{- $env = "production" }}
{{- else if contains "stg" . }}
{{- $env = "staging" }}
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $.Values.idp.externalSecret.name | default "idp-env-secrets" }}
  namespace: {{ $namespace }}
  labels:
    {{- include "openbao-secrets-manager.labels" $ | nindent 4 }}
    app.kubernetes.io/component: idp-external-secret
    environment: {{ $env }}
spec:
  refreshInterval: {{ $.Values.idp.externalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ include "openbao-secrets-manager.secretStoreName" $ }}
    kind: SecretStore
  target:
    name: {{ $.Values.idp.externalSecret.target.name | default "idp-env-secrets" }}
    creationPolicy: {{ $.Values.idp.externalSecret.target.creationPolicy | default "Owner" }}
    template:
      type: {{ $.Values.idp.externalSecret.target.template.type | default "Opaque" }}
      metadata:
        labels:
          {{- include "openbao-secrets-manager.labels" $ | nindent 10 }}
          {{- with $.Values.idp.externalSecret.target.template.metadata.labels }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          environment: {{ $env }}
  dataFrom:
    - extract:
        {{- if eq $env "production" }}
        key: {{ $.Values.idp.production.remoteRef.key | default "idp/production" }}
        {{- else if eq $env "staging" }}
        key: {{ $.Values.idp.staging.remoteRef.key | default "idp/staging" }}
        {{- else }}
        key: {{ $.Values.idp.development.remoteRef.key | default "idp/development" }}
        {{- end }}
{{- end }}
{{- end }}
